name: Build and Release Ducky's Visuals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOD_VERSION: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Satin 26.2 source
        uses: actions/checkout@v6
        with:
          repository: GzSakura1338/Satin-26.2
          ref: main
          path: Satin-26.2
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.0
      - name: Build and publish Satin to the runner Maven cache
        run: gradle -p Satin-26.2 publishToMavenLocal
      - name: Build versioned Fabric mod
        run: gradle -Pmod_version="$MOD_VERSION" build
      - name: Validate Iris GLSL shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator -l iris-shaderpack/shaders/gbuffers_terrain.vsh iris-shaderpack/shaders/gbuffers_terrain.fsh
          glslangValidator -l iris-shaderpack/shaders/composite.vsh iris-shaderpack/shaders/composite.fsh
      - name: Package Iris shader pack
        run: |
          mkdir -p build/libs
          cd iris-shaderpack
          zip -r "../libs/ducky-s-visuals-iris-26.2.zip" shaders README.md pack.mcmeta
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ducky-s-visuals-26.2-${{ env.MOD_VERSION }}
          path: |
            build/libs/*.jar
            build/libs/ducky-s-visuals-iris-26.2.zip
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: Ducky's Visuals v${{ env.MOD_VERSION }}
          body: |
            Automated Minecraft 26.2 builds.
            Includes the legacy Fabric mod JAR and the native Iris shader-pack ZIP.
          files: |
            build/libs/*.jar
            build/libs/ducky-s-visuals-iris-26.2.zip
          prerelease: true
          generate_release_notes: true
